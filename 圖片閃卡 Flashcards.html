<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圖片閃卡 Flashcards</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f3ee;--card:#fff;--ink:#222;--mute:#7a766d;--line:#e2ded4;--pri:#2f5d50;--ok:#2e9d5b;--warn:#e08a1e;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#222527;--ink:#eee;--mute:#9a9a94;--line:#363a3c;--pri:#6fb29f;--ok:#4cc17f;--warn:#f0a443;--danger:#e5675a}}
:root[data-theme="dark"]{--bg:#17191a;--card:#222527;--ink:#eee;--mute:#9a9a94;--line:#363a3c;--pri:#6fb29f;--ok:#4cc17f;--warn:#f0a443;--danger:#e5675a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0 auto 0 0}
.tab{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
button,select,input[type=text]{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.dan{color:var(--danger)}.btn:disabled{opacity:.4;cursor:not-allowed}
.manage{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:720px){.manage{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.set{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.set:hover{background:var(--bg)}.set.on{background:var(--bg);outline:2px solid var(--pri)}
.set b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.thumb span{display:block;padding:4px 8px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb input{position:absolute;top:6px;left:6px;width:20px;height:20px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--mute)}
.drop.over{border-color:var(--pri);background:var(--bg)}
.empty{color:var(--mute);text-align:center;padding:28px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(460px,92vw);padding:18px}
dialog::backdrop{background:#0007}
dialog input[type=text],dialog select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:6px 0 10px}
dialog img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--bg);border-radius:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center;padding:8px 4px}
.stage{max-width:820px;margin:0 auto;text-align:center}
.stage .view{width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage .view img{max-width:100%;max-height:100%;object-fit:contain}
.ctrl{display:flex;justify-content:center;gap:22px;margin:18px 0}
.round{width:76px;height:76px;border-radius:50%;border:3px solid;background:var(--card);cursor:pointer;display:grid;place-items:center}
.round svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.round.ok{color:var(--ok)}.round.no{color:var(--warn)}.round.un{color:var(--mute);width:56px;height:56px;align-self:center}
.round:active{transform:scale(.94)}.round:disabled{opacity:.3}
.stat{color:var(--mute)}
.cap{min-height:26px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🗂️ 圖片閃卡</h1>
  <button class="tab on" data-t="manage">管理</button>
  <button class="tab" data-t="quiz">測驗</button>
</header>
<main>
  <div id="warn" class="panel" style="display:none;margin-bottom:12px;color:var(--danger)">⚠️ 此瀏覽器無法使用本機儲存，關閉頁面後資料會消失。</div>

  <section id="manage" class="manage">
    <div class="panel">
      <div class="row">
        <button class="btn pri" id="addSet">＋ 新增主題集</button>
        <button class="btn dan" id="delSets" disabled>刪除勾選</button>
      </div>
      <div id="setList"></div>
    </div>
    <div class="panel" id="cardPanel"></div>
  </section>

  <section id="quiz" hidden>
    <div id="qSetup" class="panel" style="max-width:520px;margin:0 auto"></div>
    <div id="qPlay" class="stage" hidden></div>
  </section>
</main>

<dialog id="dlg"></dialog>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="fileOne" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DB=null,sets=[],cards=[],cur=null,sel=new Set(),setSel=new Set();

/* ---------- 儲存 (IndexedDB) ---------- */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('flashcards',1);
 q.onupgradeneeded=()=>{q.result.createObjectStore('sets',{keyPath:'id'});q.result.createObjectStore('cards',{keyPath:'id'})};
 q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
function dbOp(st,op,v){if(!DB)return Promise.resolve();return new Promise(r=>{try{const t=DB.transaction(st,'readwrite');t.objectStore(st)[op](v);t.oncomplete=()=>r();t.onerror=()=>r();t.onabort=()=>r()}catch(e){r()}})}
function dbAll(st){if(!DB)return Promise.resolve([]);return new Promise(r=>{try{const q=DB.transaction(st).objectStore(st).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])}catch(e){r([])}})}
const saveSet=s=>dbOp('sets','put',s);
const saveCard=c=>dbOp('cards','put',{id:c.id,setId:c.setId,name:c.name,blob:c.blob,t:c.t});
const delCard=c=>{URL.revokeObjectURL(c.url);return dbOp('cards','delete',c.id)};

/* ---------- 圖片處理：縮到 1024×768 內 ---------- */
function fit(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,1024/im.width,768/im.height),w=Math.round(im.width*k),h=Math.round(im.height*k);
  if(k===1&&file.size<1.5e6){URL.revokeObjectURL(u);return res(file)}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',.9)};
 im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
async function addFiles(files,setId){
 const list=[...files].filter(f=>f.type.startsWith('image/'));let n=0;
 for(const f of list){const b=await fit(f);if(!b)continue;
  const c={id:uid(),setId,name:f.name.replace(/\.[^.]+$/,''),blob:b,t:Date.now()+n++};c.url=URL.createObjectURL(b);cards.push(c);await saveCard(c)}
 renderAll()}

/* ---------- 對話框 ---------- */
function modal(title,{text='',input,okLabel='確定',danger=false}={}){return new Promise(res=>{
 const d=$('#dlg');d.innerHTML=`<h3 style="margin:0 0 8px">${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${input!==undefined?`<input type="text" id="mi" value="${esc(input)}">`:''}
 <div class="acts"><button class="btn" id="mc">取消</button><button class="btn ${danger?'dan':'pri'}" id="mo">${okLabel}</button></div>`;
 let done=false;const fin=v=>{if(done)return;done=true;d.close();res(v)};
 $('#mc').onclick=()=>fin(null);$('#mo').onclick=()=>fin(input!==undefined?($('#mi').value.trim()||null):true);
 d.onclose=()=>fin(null);if(input!==undefined)$('#mi').onkeydown=e=>{if(e.key==='Enter')$('#mo').click()};
 d.showModal();if(input!==undefined)$('#mi').select()})}

/* ---------- 管理介面 ---------- */
const cnt=id=>cards.filter(c=>c.setId===id).length;
function renderSets(){
 $('#setList').innerHTML=sets.length?sets.map(s=>`<div class="set ${s.id===cur?'on':''}" data-id="${s.id}">
  <input type="checkbox" data-chk="${s.id}" ${setSel.has(s.id)?'checked':''}><b>${esc(s.name)}</b><small>${cnt(s.id)}</small></div>`).join(''):'<div class="empty">尚無主題集，請先新增一個</div>';
 $('#delSets').disabled=!setSel.size;$('#delSets').textContent=setSel.size?`刪除勾選 (${setSel.size})`:'刪除勾選'}
function renderCards(){
 const p=$('#cardPanel'),s=sets.find(x=>x.id===cur);
 if(!s){p.innerHTML='<div class="empty">請在左側選擇或新增主題集</div>';return}
 const list=cards.filter(c=>c.setId===cur).sort((a,b)=>a.t-b.t);
 const others=sets.filter(x=>x.id!==cur);
 p.innerHTML=`<div class="row"><h3 style="margin:0 auto 0 0">${esc(s.name)}</h3><button class="btn" id="ren">重新命名</button></div>
 <div class="row">
  <button class="btn pri" id="up">＋ 批量上傳圖片</button>
  <button class="btn" id="all">${sel.size&&sel.size===list.length?'取消全選':'全選'}</button>
  <button class="btn dan" id="delC" ${sel.size?'':'disabled'}>刪除所選 (${sel.size})</button>
  <select id="mv" class="btn" ${sel.size&&others.length?'':'disabled'}><option value="">移至其他主題集…</option>${others.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>
 </div>
 ${list.length?`<div class="grid">${list.map(c=>`<div class="thumb" data-c="${c.id}"><img src="${c.url}" alt=""><input type="checkbox" data-cc="${c.id}" ${sel.has(c.id)?'checked':''}><span>${esc(c.name)||'（未命名）'}</span></div>`).join('')}</div>`
 :'<div class="drop" id="drop">把圖片拖曳到這裡，或點「批量上傳圖片」</div>'}`}
function renderAll(){renderSets();renderCards()}

$('#addSet').onclick=async()=>{const n=await modal('新增主題集',{input:''});if(!n)return;const s={id:uid(),name:n,t:Date.now()};sets.push(s);cur=s.id;sel.clear();await saveSet(s);renderAll()};
$('#delSets').onclick=async()=>{if(!await modal('刪除主題集',{text:`確定刪除 ${setSel.size} 個主題集及其所有卡片？此動作無法復原。`,okLabel:'刪除',danger:true}))return;
 for(const id of setSel){for(const c of cards.filter(c=>c.setId===id))await delCard(c);cards=cards.filter(c=>c.setId!==id);sets=sets.filter(s=>s.id!==id);await dbOp('sets','delete',id);if(cur===id)cur=null}
 setSel.clear();sel.clear();renderAll()};
$('#setList').onclick=e=>{const ck=e.target.dataset.chk;if(ck){e.target.checked?setSel.add(ck):setSel.delete(ck);renderSets();return}
 const el=e.target.closest('.set');if(el){cur=el.dataset.id;sel.clear();renderAll()}};

$('#cardPanel').onclick=async e=>{const t=e.target;
 if(t.id==='up'){$('#file').click();return}
 if(t.id==='ren'){const s=sets.find(x=>x.id===cur),n=await modal('重新命名主題集',{input:s.name});if(n){s.name=n;await saveSet(s);renderAll()}return}
 if(t.id==='all'){const l=cards.filter(c=>c.setId===cur);sel.size===l.length?sel.clear():l.forEach(c=>sel.add(c.id));renderCards();return}
 if(t.id==='delC'){if(!await modal('刪除卡片',{text:`確定刪除 ${sel.size} 張卡片？`,okLabel:'刪除',danger:true}))return;
  for(const c of cards.filter(c=>sel.has(c.id)))await delCard(c);cards=cards.filter(c=>!sel.has(c.id));sel.clear();renderAll();return}
 if(t.dataset.cc){t.checked?sel.add(t.dataset.cc):sel.delete(t.dataset.cc);renderCards();return}
 const th=t.closest('.thumb');if(th)editCard(cards.find(c=>c.id===th.dataset.c))};
$('#cardPanel').onchange=async e=>{if(e.target.id==='mv'&&e.target.value){for(const c of cards.filter(c=>sel.has(c.id))){c.setId=e.target.value;await saveCard(c)}sel.clear();renderAll()}};
$('#file').onchange=e=>{if(cur)addFiles(e.target.files,cur);e.target.value=''};
const pan=$('#cardPanel');
pan.ondragover=e=>{e.preventDefault()};
pan.ondrop=e=>{e.preventDefault();if(cur&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files,cur)};

function editCard(c){const d=$('#dlg');
 d.innerHTML=`<img id="ep" src="${c.url}" alt=""><label>名稱／答案（測驗時點圖片可顯示）</label><input type="text" id="en" value="${esc(c.name)}">
 <label>所屬主題集</label><select id="es">${sets.map(s=>`<option value="${s.id}" ${s.id===c.setId?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
 <div class="acts"><button class="btn dan" id="ed">刪除</button><button class="btn" id="er">更換圖片</button><button class="btn" id="ec">取消</button><button class="btn pri" id="eo">儲存</button></div>`;
 d.onclose=null;let nb=null;
 $('#ec').onclick=()=>d.close();
 $('#er').onclick=()=>{$('#fileOne').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;nb=await fit(f);if(nb)$('#ep').src=URL.createObjectURL(nb)};$('#fileOne').click()};
 $('#eo').onclick=async()=>{c.name=$('#en').value.trim();c.setId=$('#es').value;if(nb){URL.revokeObjectURL(c.url);c.blob=nb;c.url=URL.createObjectURL(nb)}await saveCard(c);d.close();sel.clear();renderAll()};
 $('#ed').onclick=async()=>{d.close();if(await modal('刪除卡片',{text:'確定刪除這張卡片？',okLabel:'刪除',danger:true})){await delCard(c);cards=cards.filter(x=>x!==c);sel.delete(c.id);renderAll()}};
 d.showModal()}

/* ---------- 測驗 ---------- */
let pool=[],hist=[],mastered=0,total=0,qSel=new Set(),qAll=true,showCap=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function renderSetup(){
 const el=$('#qSetup');
 el.innerHTML=`<h3 style="margin-top:0">開始測驗</h3>
 <label class="chk"><input type="radio" name="m" value="all" ${qAll?'checked':''}> 所有主題集混合（共 ${cards.length} 張）</label>
 <label class="chk"><input type="radio" name="m" value="pick" ${qAll?'':'checked'}> 選擇主題集</label>
 <div style="margin-left:26px;${qAll?'opacity:.4;pointer-events:none':''}">${sets.map(s=>`<label class="chk"><input type="checkbox" data-q="${s.id}" ${qSel.has(s.id)?'checked':''}> ${esc(s.name)} <small style="color:var(--mute)">(${cnt(s.id)})</small></label>`).join('')||'<div class="empty">尚無主題集</div>'}</div>
 <div class="acts"><button class="btn pri" id="go">開始</button></div>`;
 const ids=qAll?cards:cards.filter(c=>qSel.has(c.setId));$('#go').disabled=!ids.length;
 el.onchange=e=>{if(e.target.name==='m'){qAll=e.target.value==='all'}else if(e.target.dataset.q){e.target.checked?qSel.add(e.target.dataset.q):qSel.delete(e.target.dataset.q)}renderSetup()};
 $('#go').onclick=()=>{pool=shuffle(ids.map(c=>c.id));total=pool.length;mastered=0;hist=[];showCap=false;$('#qSetup').hidden=true;$('#qPlay').hidden=false;renderPlay()}}
const SVG={o:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/></svg>',t:'<svg viewBox="0 0 40 40"><path d="M20 6 L36 33 H4 Z"/></svg>',u:'<svg viewBox="0 0 40 40"><path d="M14 10 L6 18 L14 26 M6 18 H24 a10 10 0 0 1 0 20 H16"/></svg>'};
function renderPlay(){
 const el=$('#qPlay');
 if(!pool.length){el.innerHTML=`<div class="panel" style="padding:40px"><h2>🎉 全部完成！</h2><p>共 ${total} 張卡片皆已標記為 OK。</p>
  <div class="ctrl" style="gap:10px"><button class="btn" id="undo">↶ 上一步</button><button class="btn pri" id="again">再測一次</button><button class="btn" id="back">回設定</button></div></div>`;bindPlay();return}
 const c=cards.find(x=>x.id===pool[0]);
 el.innerHTML=`<div class="stat">已完成 ${mastered} / ${total}　·　剩餘 ${pool.length}</div>
 <div class="view" id="img"><img src="${c.url}" alt=""></div>
 <div class="cap" id="cap">${showCap&&c.name?esc(c.name):''}</div>
 <div class="ctrl"><button class="round un" id="undo" title="復原（上一步）" ${hist.length?'':'disabled'}>${SVG.u}</button>
 <button class="round ok" id="ok" title="OK，不再出現">${SVG.o}</button>
 <button class="round no" id="no" title="不熟悉，稍後再出現">${SVG.t}</button></div>
 <button class="btn" id="back">結束測驗</button>`;bindPlay()}
function bindPlay(){const g=id=>$('#qPlay #'+id);
 const snap=()=>hist.push({pool:[...pool],m:mastered});
 if(g('ok'))g('ok').onclick=()=>{snap();pool.shift();mastered++;showCap=false;renderPlay()};
 if(g('no'))g('no').onclick=()=>{snap();const c=pool.shift();if(!pool.length)pool.push(c);else pool.splice(1+Math.floor(Math.random()*pool.length),0,c);showCap=false;renderPlay()};
 if(g('undo'))g('undo').onclick=()=>{const h=hist.pop();if(!h)return;pool=h.pool;mastered=h.m;showCap=false;renderPlay()};
 if(g('img'))g('img').onclick=()=>{showCap=!showCap;const c=cards.find(x=>x.id===pool[0]);g('cap').textContent=showCap&&c.name?c.name:''};
 if(g('back'))g('back').onclick=()=>{$('#qPlay').hidden=true;$('#qSetup').hidden=false;renderSetup()};
 if(g('again'))g('again').onclick=()=>$('#go')?($('#qPlay').hidden=true,$('#qSetup').hidden=false,$('#go').click()):0}

/* ---------- 分頁與啟動 ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 $('#manage').hidden=b.dataset.t!=='manage';$('#quiz').hidden=b.dataset.t!=='quiz';
 if(b.dataset.t==='quiz'){$('#qPlay').hidden=true;$('#qSetup').hidden=false;renderSetup()}else renderAll()});
(async()=>{DB=await openDB();if(!DB)$('#warn').style.display='block';
 sets=(await dbAll('sets')).sort((a,b)=>a.t-b.t);
 cards=(await dbAll('cards')).map(c=>(c.url=URL.createObjectURL(c.blob),c));
 cur=sets[0]?.id||null;renderAll()})();
</script>
</body>
</html>
